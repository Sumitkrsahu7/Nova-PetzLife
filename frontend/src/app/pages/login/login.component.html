<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">🐾</div>
      <h2>Welcome Back</h2>
      <p>Log in to access your NOVA PETZLIFE account and orders</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="identifier">Email Address or 10-Digit Mobile Number</label>
        <input
          type="text"
          id="identifier"
          name="identifier"
          [(ngModel)]="identifier"
          (input)="onInputChange()"
          placeholder="e.g. anand@example.com or 9847012345"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <div class="password-label-row">
          <label for="password">Password</label>
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            {{ showPassword ? '👁️ Hide' : '👁️ Show' }}
          </button>
        </div>
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          name="password"
          [(ngModel)]="password"
          (input)="onInputChange()"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        <span *ngIf="!isLoading">Log In</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
      <p class="store-hint">Store pickup & delivery: Kuravankonam Junction, Thiruvananthapuram</p>
    </div>
  </div>
</div>
