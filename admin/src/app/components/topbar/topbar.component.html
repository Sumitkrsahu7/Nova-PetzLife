<header class="admin-topbar">
  <div class="topbar-left">
    <button
      type="button"
      class="mobile-menu-btn"
      (click)="toggleDrawer()"
      aria-label="Open navigation menu"
      title="Open navigation menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <div class="title-wrap">
      <h1 class="page-title">{{ pageTitle }}</h1>
      <div class="store-crumb">
        <span class="crumb-icon">📍</span>
        <span>Shop: <strong>Petzlife, Kuravankonam</strong> (20 km Radius)</span>
      </div>
    </div>
  </div>

  <div class="topbar-right">
    <!-- Store Settings Link -->
    <a routerLink="/delivery-settings" class="btn-store-location" title="Configure Store Location, GPS Coordinates & Delivery Radius">
      📍 Store Settings
    </a>
  </div>
</header>
