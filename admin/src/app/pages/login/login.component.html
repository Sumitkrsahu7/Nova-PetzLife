<div class="login-wrapper">
  <div class="login-card">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="logo-box">🐾</div>
      <h2>NOVA PETZLIFE</h2>
      <p class="portal-desc">Admin Control Center • Kuravankonam, TVM</p>
    </div>

    <!-- Quick Role Fill Pills -->
    <div class="role-selector-strip">
      <span class="strip-label">Development Demo Credentials:</span>
      <div class="pills">
        <button
          type="button"
          class="role-pill"
          [class.active]="selectedRole === 'ROLE_SUPER_ADMIN'"
          (click)="fillDemoCredentials('ROLE_SUPER_ADMIN')"
        >
          👑 Super Admin (test&#64;gmail.com / Test&#64;123)
        </button>
        <button
          type="button"
          class="role-pill"
          [class.active]="selectedRole === 'ROLE_STAFF_ADMIN'"
          (click)="fillDemoCredentials('ROLE_STAFF_ADMIN')"
        >
          👤 Staff Admin (staff&#64;novapetzlife.com)
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div *ngIf="errorMessage" class="error-banner">
        ⚠️ {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="identifier">Admin Email Address or 10-Digit Mobile Number</label>
        <input
          id="identifier"
          type="text"
          name="identifier"
          [(ngModel)]="identifier"
          (input)="onInputChange()"
          placeholder="e.g. test@gmail.com or 9876543200"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <div class="password-label-row">
          <label for="password">Password</label>
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            {{ showPassword ? '👁️ Hide' : '👁️ Show' }}
          </button>
        </div>
        <div class="password-input-wrap">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            (input)="onInputChange()"
            placeholder="e.g. Test@123"
            required
          />
        </div>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" checked />
          <span>Keep me signed in</span>
        </label>
        <span class="env-pill">Phase 2 Design Preview</span>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In to Dashboard →</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>
    </form>

    <!-- Footer Notice -->
    <div class="login-footer">
      <p>🛡️ Audited Admin Portal. Unauthorized access attempts are monitored and recorded.</p>
    </div>
  </div>
</div>
