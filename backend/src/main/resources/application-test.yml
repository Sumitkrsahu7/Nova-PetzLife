spring:
  datasource:
    url: jdbc:h2:mem:nova_petzlife_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

razorpay:
  key-id: rzp_test_mock_id
  key-secret: mock_secret_key
  webhook-secret: mock_webhook_secret
  currency: INR

logging:
  level:
    com.novapetzlife: INFO
    org.flywaydb: INFO
