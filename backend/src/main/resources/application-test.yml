spring:
  datasource:
    url: jdbc:h2:mem:nova_petzlife_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  rate-limiting:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://nova-petzlife-admin.onrender.com,https://nova-petzlife.onrender.com,https://novapetzlife.com,https://admin.novapetzlife.com}
  jwt:
    secret: test_mock_jwt_signing_secret_key_minimum_256_bits_length_for_unit_tests_2026
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
    cookie-secure: false
    cookie-same-site: Lax

razorpay:
  key-id: rzp_test_mock_id
  key-secret: mock_secret_key
  webhook-secret: mock_webhook_secret
  currency: INR

logging:
  level:
    com.novapetzlife: INFO
    org.flywaydb: INFO
