server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: nova-petzlife-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nova_petzlife}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:novapetz}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 120000
      keepalive-time: 30000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 20000
  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  version: 1.0.0
  jwt:
    secret: ${JWT_SECRET:${APP_JWT_SECRET:}}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  media:
    local-storage-enabled: ${LOCAL_MEDIA_STORAGE_ENABLED:true}
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads/products}
    base-url: ${MEDIA_BASE_URL:}
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  frontend-base-url: ${CUSTOMER_FRONTEND_URL:${FRONTEND_URL:http://localhost:4200}}
  customer-base-url: ${APP_CUSTOMER_BASE_URL:${CUSTOMER_FRONTEND_URL:${FRONTEND_URL:http://localhost:4200}}}
  password-reset-path: ${APP_PASSWORD_RESET_PATH:/reset-password}
  auth:
    password-reset-token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
  shop:
    name: ${SHOP_NAME:NOVA PETZLIFE}
    address: ${SHOP_ADDRESS:}
    city: ${SHOP_CITY:}
    state: ${SHOP_STATE:Kerala}
    country: ${SHOP_COUNTRY:India}
    pin-code: ${SHOP_PIN_CODE:}
    default-delivery-radius-km: 20.0

resend:
  enabled: ${RESEND_ENABLED:false}
  api-key: ${RESEND_API_KEY:}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}
  from-email: ${RESEND_FROM_EMAIL:}
  from-name: ${RESEND_FROM_NAME:NOVA PETZLIFE}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: INR

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
