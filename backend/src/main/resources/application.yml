server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nova-petzlife-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:nova_petzlife;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  version: 1.0.0
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201
  shop:
    name: "NOVA PETZLIFE"
    address: "Petzlife, Kuravankonam Junction, Kuravankonam Ambalamukku Road, Thiruvananthapuram, Kerala 695003, India"
    city: "Thiruvananthapuram"
    state: "Kerala"
    country: "India"
    pin-code: "695003"
    default-delivery-radius-km: 20.0

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_nova_petzlife_sample}
  key-secret: ${RAZORPAY_KEY_SECRET:nova_test_secret_key_12345}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:nova_test_webhook_secret_67890}
  currency: INR

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
