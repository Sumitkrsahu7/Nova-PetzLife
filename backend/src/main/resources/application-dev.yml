spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/nova_petzlife?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:novapetz}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:${APP_JWT_SECRET:dev_local_jwt_secret_key_minimum_256_bits_for_testing_2026}}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_nova_sample}
  key-secret: ${RAZORPAY_KEY_SECRET:nova_dev_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:nova_dev_webhook_secret}
  currency: INR

logging:
  level:
    com.novapetzlife: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
