spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 120000
      keepalive-time: 30000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 20000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nova-petzlife-admin.onrender.com,https://nova-petzlife.onrender.com,https://novapetzlife.com,https://admin.novapetzlife.com}
  frontend:
    url: ${FRONTEND_URL:https://novapetzlife.com}
  frontend-base-url: ${CUSTOMER_FRONTEND_URL:${FRONTEND_URL:https://novapetzlife.com}}
  password-reset-path: ${APP_PASSWORD_RESET_PATH:/reset-password}
  auth:
    password-reset-token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  media:
    local-storage-enabled: ${LOCAL_MEDIA_STORAGE_ENABLED:true}
    upload-dir: ${MEDIA_UPLOAD_DIR:/app/uploads/products}
    base-url: ${MEDIA_BASE_URL:}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from-email: ${BREVO_FROM_EMAIL:support@novapetzlife.com}
    from-name: ${BREVO_FROM_NAME:NOVA PETZLIFE}
    smtp:
      host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
      port: ${BREVO_SMTP_PORT:587}
      username: ${BREVO_SMTP_USERNAME:}
      password: ${BREVO_SMTP_PASSWORD:}

resend:
  api-key: ${RESEND_API_KEY:}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}
  from-email: ${RESEND_FROM_EMAIL:no-reply@mail.novapetzlife.com}
  from-name: ${RESEND_FROM_NAME:NOVA PETZLIFE}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: INR

logging:
  level:
    root: WARN
    com.novapetzlife: INFO
