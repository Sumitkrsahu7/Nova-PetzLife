version: '3.8'

services:
  # ============================================================================
  # 1. MySQL Database Service (MySQL 8.4 LTS)
  # ============================================================================
  mysql:
    image: mysql:8.4
    container_name: nova-petzlife-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nova_petzlife}
      MYSQL_USER: ${DB_USERNAME:-novapetz}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - nova_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-network

  # ============================================================================
  # 2. Spring Boot REST API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nova-petzlife-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-nova_petzlife}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-novapetz}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GMAIL_BRIDGE_ENABLED: ${GMAIL_BRIDGE_ENABLED:-false}
      GMAIL_BRIDGE_WEBHOOK_URL: ${GMAIL_BRIDGE_WEBHOOK_URL:-}
      GMAIL_BRIDGE_SECRET: ${GMAIL_BRIDGE_SECRET:-}
      GMAIL_BRIDGE_FROM_NAME: ${GMAIL_BRIDGE_FROM_NAME:-NOVA PETZLIFE}
      CUSTOMER_FRONTEND_URL: ${CUSTOMER_FRONTEND_URL:-https://novapetzlife.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201,https://novapetzlife.com,https://admin.novapetzlife.com}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nova-network

  # ============================================================================
  # 3. Customer-Facing Angular Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nova-petzlife-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - nova-network

  # ============================================================================
  # 4. Standalone Administrative Angular Application
  # ============================================================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: nova-petzlife-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4201:80"
    networks:
      - nova-network

networks:
  nova-network:
    driver: bridge

volumes:
  nova_mysqldata:
    driver: local
